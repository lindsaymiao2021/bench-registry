<title>Van Cortlandt Bench Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --ground:#F2F3EE; --surface:#FFFFFF; --ink:#1F2A22; --muted:#5E6A61; --line:#D9DDD3;
  --green:#2E6B3F; --green-soft:#DCE9DF; --amber:#C4861A; --amber-soft:#F6E7CB;
  --wood:#8A5A33; --brass:#B8943F; --brass-2:#E3CC8A; --brass-ink:#3B2E10;
  --danger:#A23B2A; --focus:#1E5FA8;
  --display:"Overpass","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#151B17; --surface:#1D2520; --ink:#E7EDE7; --muted:#9AA79E; --line:#33403A;
    --green:#5FAE78; --green-soft:#23372A; --amber:#E0A544; --amber-soft:#3A2F1C;
    --wood:#C08A5C; --brass:#C9A553; --brass-2:#8E7433; --brass-ink:#FFF4D6;
    --danger:#E07A66; --focus:#7FB2F0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#151B17; --surface:#1D2520; --ink:#E7EDE7; --muted:#9AA79E; --line:#33403A;
  --green:#5FAE78; --green-soft:#23372A; --amber:#E0A544; --amber-soft:#3A2F1C;
  --wood:#C08A5C; --brass:#C9A553; --brass-2:#8E7433; --brass-ink:#FFF4D6;
  --danger:#E07A66; --focus:#7FB2F0;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);letter-spacing:.02em}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* header */
header{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink)}
header h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);max-width:56ch}
.stats{display:flex;flex-wrap:wrap;gap:6px 24px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 8px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.search{flex:1 1 220px;max-width:340px;padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

/* status swatches */
.sw{width:12px;height:12px;border-radius:2px;display:inline-block;flex:none}
.s-available{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.s-adopted{background:var(--green)}
.s-expiring{background:var(--amber)}
.s-reserved{background:repeating-linear-gradient(135deg,var(--green) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1.5px var(--green)}

/* main layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.zones{display:flex;flex-direction:column;gap:22px}
.zone-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.zone-head h2{font-size:17px;font-weight:700}
.zone-head .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:18px;height:18px;border:0;border-radius:3px;padding:0;cursor:pointer;transition:transform .12s,opacity .12s}
.dot:hover{transform:scale(1.25)}
.dot.dim{opacity:.18}
.dot.sel{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.dot{transition:none}.dot:hover{transform:none}}

/* list */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
tbody tr{cursor:pointer}
tbody tr:hover,tbody tr.sel{background:var(--green-soft)}
.more{margin-top:10px;color:var(--muted);font-size:13px}

/* detail panel */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);overflow:auto}
@media (max-width:900px){aside{position:static;max-height:none}}
.empty{color:var(--muted)}
.bench-id{font-family:var(--mono);font-size:24px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px}
.p-available{background:var(--ground);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.p-adopted,.p-reserved{background:var(--green-soft);color:var(--green)}
.p-expiring{background:var(--amber-soft);color:var(--amber)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
dt{color:var(--muted)}
dd{margin:0;font-variant-numeric:tabular-nums}
.plaque{background:linear-gradient(160deg,var(--brass-2),var(--brass) 70%);color:var(--brass-ink);border-radius:4px;padding:14px 16px;text-align:center;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;line-height:1.35;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.35);white-space:pre-line;min-height:62px;display:flex;align-items:center;justify-content:center}
.plaque-wrap{border-top:6px solid var(--wood);border-radius:3px 3px 0 0;padding-top:10px}
.history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.history li{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.history li b{color:var(--ink);font-weight:500}

form{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
form h3{font-size:17px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--line);border-radius:5px;background:var(--ground)}
.field textarea{resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.err{color:var(--danger);font-size:13px;margin:0}
.btn{background:var(--green);color:#fff;border:0;border-radius:6px;padding:10px 14px;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0E1510}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0E1510}}
.btn:hover{filter:brightness(1.08)}
.summary{font-size:13px;color:var(--muted);background:var(--ground);border-radius:5px;padding:8px 10px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:13px}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="label">NYC Parks · Van Cortlandt Park, Bronx</div>
      <h1>Bench Adoption Registry</h1>
      <p>Every bench in the park, who has adopted it, and until when. Pick an open bench to adopt it.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="View">
      <button id="v-map" aria-pressed="true">By area</button>
      <button id="v-list" aria-pressed="false">List</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
    <input class="search" id="q" type="search" placeholder="Search bench ID or donor…" aria-label="Search bench ID or donor">
  </div>

  <div class="main">
    <section id="view" aria-live="polite"></section>
    <aside id="panel" aria-label="Bench details"></aside>
  </div>

  <footer>
    <span>This demo uses sample benches and donors. Adoptions are saved in this browser only.</span>
    <button class="linkbtn" id="reset">Reset sample data</button>
  </footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
/* ---------- dates (all ISO yyyy-mm-dd, computed in UTC) ---------- */
const DAY = 864e5;
const toD = s => new Date(s + "T00:00:00Z");
const iso = d => d.toISOString().slice(0, 10);
const now = new Date();
const TODAY = iso(new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())));
const addDays = (s, n) => iso(new Date(toD(s).getTime() + n * DAY));
function addMonths(s, m) {
  const d = toD(s), day = d.getUTCDate();
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + m, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  t.setUTCDate(Math.min(day, last));
  return iso(t);
}
// A term of N months starting on S ends the day before the same date N months later (inclusive).
const endOf = (start, months) => addDays(addMonths(start, months), -1);
const fmt = s => toD(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
const daysBetween = (a, b) => Math.round((toD(b) - toD(a)) / DAY);
const termLabel = m => m % 12 === 0 ? `${m / 12} year${m === 12 ? "" : "s"}` : `${m} months`;
const EXPIRING_DAYS = 90;

/* ---------- inventory: 520 benches across 13 areas (deterministic) ---------- */
const ZONES = [
  ["PG", "Parade Ground", 70], ["LK", "Van Cortlandt Lake", 60], ["PT", "Putnam Trail", 50],
  ["SH", "Shandler Recreation Area", 45], ["AQ", "Old Croton Aqueduct Trail", 45],
  ["TB", "Tibbetts Brook", 40], ["ST", "Van Cortlandt Stadium", 40], ["NW", "Northwest Forest", 35],
  ["JK", "John Kieran Nature Trail", 35], ["HM", "Van Cortlandt House Museum", 30],
  ["VH", "Vault Hill", 25], ["IF", "Indian Field", 25], ["GC", "Golf Course Clubhouse", 20],
];
const TYPES = ["World's Fair bench (6 ft)", "World's Fair bench (8 ft)", "Backless slat bench", "Accessible bench with companion space"];
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 2 ** 32; }; }
const r = rng(7);
const BENCHES = [];
for (const [code, name, n] of ZONES)
  for (let i = 1; i <= n; i++)
    BENCHES.push({ id: `VC-${code}-${String(i).padStart(3, "0")}`, zone: code, zoneName: name, type: TYPES[Math.floor(r() ** 1.8 * TYPES.length)] });
const BY_ID = Object.fromEntries(BENCHES.map(b => [b.id, b]));

/* ---------- storage: one list of adoption records ---------- */
const KEY = "vcp-bench-adoptions-v1";
let adoptions = load();
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(adoptions)); } catch (e) {} }
function seed() {
  const first = ["Maria", "James", "Aisha", "Daniel", "Rosa", "Kevin", "Priya", "Tom", "Yolanda", "Samuel", "Grace", "Luis", "Hannah", "Omar", "Beatriz", "Victor"];
  const last = ["Delgado", "O'Brien", "Okafor", "Kim", "Rivera", "Feldman", "Patel", "Nguyen", "Morales", "Goldberg", "Adeyemi", "Santos"];
  const orgs = ["Riverdale Running Club", "Friends of Van Cortlandt Park", "Kingsbridge Garden Society", "Class of 1998, DeWitt Clinton HS", "Bronx Birders"];
  const lines = [n => `In loving memory of\n${n}`, n => `For ${n}\nwho walked here every morning`, n => `Donated by\n${n}`, n => `Rest a while.\n— ${n}`];
  const sr = rng(42), out = [];
  const pick = a => a[Math.floor(sr() * a.length)];
  for (const b of BENCHES) {
    const x = sr();
    if (x > 0.42) continue;
    const donor = sr() < 0.15 ? pick(orgs) : `${pick(first)} ${pick(last)}`;
    const months = pick([6, 12, 12, 24, 36, 60, 120]);
    // start somewhere so that the term is currently running, with a spread of remaining time
    const into = Math.floor(sr() * months * 30.4);
    const start = addDays(TODAY, -into);
    const honoree = `${pick(first)} ${pick(last)}`;
    out.push({ id: "a" + out.length, benchId: b.id, donor, email: "", anonymous: sr() < 0.1, plaque: pick(lines)(donor.includes(" ") && sr() < .5 ? honoree : donor).toUpperCase(), start, months, end: endOf(start, months), createdAt: start, sample: true });
    // some benches carry an expired earlier term, and a few a reservation for the next one
    if (sr() < 0.3) { const ps = addMonths(start, -24); out.push({ id: "a" + out.length, benchId: b.id, donor: `${pick(first)} ${pick(last)}`, email: "", anonymous: false, plaque: "", start: ps, months: 24, end: endOf(ps, 24), createdAt: ps, sample: true }); }
    if (sr() < 0.05) { const ns = addDays(endOf(start, months), 1); out.push({ id: "a" + out.length, benchId: b.id, donor: pick(orgs), email: "", anonymous: false, plaque: "DONATED BY\n" + pick(orgs).toUpperCase(), start: ns, months: 12, end: endOf(ns, 12), createdAt: TODAY, sample: true }); }
  }
  return out;
}

/* ---------- derived status ---------- */
function termsFor(id) { return adoptions.filter(a => a.benchId === id).sort((a, b) => a.start.localeCompare(b.start)); }
function statusOf(id) {
  const terms = termsFor(id);
  const current = terms.find(a => a.start <= TODAY && TODAY <= a.end) || null;
  const upcoming = terms.filter(a => a.start > TODAY);
  const past = terms.filter(a => a.end < TODAY).reverse();
  let status = "available";
  if (current) status = daysBetween(TODAY, current.end) <= EXPIRING_DAYS ? "expiring" : "adopted";
  else if (upcoming.length) status = "reserved";
  return { status, current, upcoming, past };
}
// earliest date a new term could begin: today, or the day after the last booked term that is still running/ahead
function earliestStart(id) {
  const ends = termsFor(id).filter(a => a.end >= TODAY).map(a => a.end).sort();
  return ends.length ? addDays(ends[ends.length - 1], 1) : TODAY;
}
function overlaps(id, start, end) { return termsFor(id).find(a => a.start <= end && start <= a.end); }

const STATUS = {
  available: "Available", adopted: "Adopted", expiring: `Ends within ${EXPIRING_DAYS} days`, reserved: "Reserved (starts later)",
};
const SHORT = { available: "Available", adopted: "Adopted", expiring: "Ending soon", reserved: "Reserved" };
const publicName = a => a.anonymous ? "Anonymous donor" : a.donor;

/* ---------- UI state ---------- */
let state = { view: "map", filter: "all", q: "", sel: null };
try { const v = localStorage.getItem(KEY + ":view"); if (v === "list" || v === "map") state.view = v; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function matches(b, s) {
  if (state.filter !== "all" && s.status !== state.filter) return false;
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  if (b.id.toLowerCase().includes(q) || b.zoneName.toLowerCase().includes(q)) return true;
  return termsFor(b.id).some(a => !a.anonymous && a.donor.toLowerCase().includes(q));
}

function renderStats(all) {
  const c = { available: 0, adopted: 0, expiring: 0, reserved: 0 };
  all.forEach(x => c[x.s.status]++);
  const adopted = c.adopted + c.expiring;
  $("stats").innerHTML = [
    [BENCHES.length, "benches"], [adopted, "adopted now"], [c.available + c.reserved, "open to adopt"], [c.expiring, `ending in ${EXPIRING_DAYS} days`],
  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");
  $("chips").innerHTML = [["all", "All", BENCHES.length], ...Object.keys(SHORT).map(k => [k, SHORT[k], c[k]])]
    .map(([k, l, n]) => `<button class="chip" data-f="${k}" aria-pressed="${state.filter === k}">${k === "all" ? "" : `<span class="sw s-${k}"></span>`}${l} <span class="label" style="letter-spacing:0">${n}</span></button>`).join("");
}

function render() {
  const all = BENCHES.map(b => ({ b, s: statusOf(b.id) }));
  renderStats(all);
  $("v-map").setAttribute("aria-pressed", state.view === "map");
  $("v-list").setAttribute("aria-pressed", state.view === "list");
  state.view === "map" ? renderMap(all) : renderList(all);
  renderPanel();
}

function renderMap(all) {
  const html = ZONES.map(([code, name]) => {
    const items = all.filter(x => x.b.zone === code);
    const taken = items.filter(x => x.s.status === "adopted" || x.s.status === "expiring").length;
    const dots = items.map(({ b, s }) => {
      const cur = s.current ? ` — ${publicName(s.current)} through ${fmt(s.current.end)}` : "";
      return `<button class="dot s-${s.status}${matches(b, s) ? "" : " dim"}${state.sel === b.id ? " sel" : ""}" data-id="${b.id}" title="${esc(b.id + " · " + SHORT[s.status] + cur)}" aria-label="${esc(b.id + ", " + SHORT[s.status] + cur)}"></button>`;
    }).join("");
    return `<div><div class="zone-head"><h2>${name}</h2><span class="count">${taken} of ${items.length} adopted</span></div><div class="dots">${dots}</div></div>`;
  }).join("");
  $("view").innerHTML = `<div class="zones">${html}</div>`;
}

function renderList(all) {
  const rows = all.filter(x => matches(x.b, x.s));
  const LIMIT = 200, shown = rows.slice(0, LIMIT);
  $("view").innerHTML = `<div class="table-wrap"><table><thead><tr><th>Bench</th><th>Area</th><th>Status</th><th>Adopted by</th><th>Through</th></tr></thead><tbody>${
    shown.map(({ b, s }) => { const a = s.current || s.upcoming[0];
      return `<tr data-id="${b.id}" class="${state.sel === b.id ? "sel" : ""}" tabindex="0"><td class="mono">${b.id}</td><td>${b.zoneName}</td><td><span class="pill p-${s.status}"><span class="sw s-${s.status}"></span>${SHORT[s.status]}</span></td><td>${a ? esc(publicName(a)) : "—"}</td><td>${a ? fmt(a.end) : "—"}</td></tr>`; }).join("")
  }</tbody></table></div>${rows.length > LIMIT ? `<p class="more">Showing ${LIMIT} of ${rows.length}. Search or filter to narrow down.</p>` : rows.length ? "" : `<p class="more">No benches match. Try another search or filter.</p>`}`;
}

function renderPanel() {
  const p = $("panel");
  if (!state.sel) {
    p.innerHTML = `<div><div class="label">Bench details</div><h3 style="margin-top:6px">Select a bench</h3></div><p class="empty">Click any square to see who has adopted a bench, or to adopt one yourself. Hollow squares are open.</p>
    <div style="display:grid;gap:6px;font-size:13.5px">${Object.keys(STATUS).map(k => `<div style="display:flex;gap:8px;align-items:center"><span class="sw s-${k}"></span>${STATUS[k]}</div>`).join("")}</div>`;
    return;
  }
  const b = BY_ID[state.sel], s = statusOf(b.id), cur = s.current;
  const earliest = earliestStart(b.id);
  let html = `<div><div class="label">${esc(b.zoneName)}</div><div class="bench-id" style="margin-top:2px">${b.id}</div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap"><span class="pill p-${s.status}"><span class="sw s-${s.status}"></span>${STATUS[s.status]}</span><span style="font-size:13px;color:var(--muted)">${b.type}</span></div></div>`;
  if (cur) {
    const left = daysBetween(TODAY, cur.end);
    html += `${cur.plaque ? `<div class="plaque-wrap"><div class="plaque">${esc(cur.plaque)}</div></div>` : ""}
    <dl><dt>Adopted by</dt><dd>${esc(publicName(cur))}</dd><dt>Term</dt><dd>${termLabel(cur.months)}</dd><dt>From</dt><dd>${fmt(cur.start)}</dd><dt>Through</dt><dd>${fmt(cur.end)}</dd><dt>Remaining</dt><dd>${left >= 60 ? Math.round(left / 30.4) + " months" : left + " days"}</dd></dl>`;
  }
  if (s.upcoming.length) html += `<div><div class="label" style="margin-bottom:6px">Reserved</div><ul class="history">${s.upcoming.map(a => `<li><b>${esc(publicName(a))}</b><span>${fmt(a.start)} – ${fmt(a.end)}</span></li>`).join("")}</ul></div>`;
  if (s.past.length) html += `<div><div class="label" style="margin-bottom:6px">Past adoptions</div><ul class="history">${s.past.map(a => `<li><b>${esc(publicName(a))}</b><span>${fmt(a.start)} – ${fmt(a.end)}</span></li>`).join("")}</ul></div>`;

  const next = earliest > TODAY;
  html += `<form id="adopt" novalidate>
    <h3>${next ? "Reserve the next term" : "Adopt this bench"}</h3>
    ${next ? `<p class="summary" style="margin:0">This bench is spoken for until ${fmt(addDays(earliest, -1))}. You can reserve it from ${fmt(earliest)}.</p>` : ""}
    <div class="field"><label for="f-name">Your name or organization</label><input id="f-name" required maxlength="80" autocomplete="name"></div>
    <div class="field"><label for="f-email">Email</label><input id="f-email" type="email" required autocomplete="email"><span class="hint">Private. Used only for renewal reminders.</span></div>
    <div class="row">
      <div class="field"><label for="f-start">Start date</label><input id="f-start" type="date" min="${earliest}" value="${earliest}" required></div>
      <div class="field"><label for="f-term">Term</label><select id="f-term">${[6, 12, 24, 36, 60, 120].map(m => `<option value="${m}"${m === 12 ? " selected" : ""}>${termLabel(m)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label for="f-plaque">Plaque inscription (optional)</label><textarea id="f-plaque" rows="3" maxlength="100" placeholder="IN MEMORY OF&#10;ROSA DELGADO"></textarea><span class="hint">Up to 3 lines, 32 characters each. Engraved in capitals.</span></div>
    <label class="check"><input type="checkbox" id="f-anon"> List me as “Anonymous donor” on this site</label>
    <p class="summary" id="f-sum" style="margin:0"></p>
    <p class="err" id="f-err" hidden></p>
    <button class="btn" type="submit">${next ? "Reserve bench" : "Adopt bench"} ${b.id}</button>
  </form>`;
  p.innerHTML = html;
  const upd = () => { const st = $("f-start").value, m = +$("f-term").value; $("f-sum").textContent = st ? `${termLabel(m)}: ${fmt(st)} through ${fmt(endOf(st, m))}` : "Pick a start date."; };
  $("f-start").addEventListener("input", upd); $("f-term").addEventListener("change", upd); upd();
  $("adopt").addEventListener("submit", e => { e.preventDefault(); submit(b.id); });
}

function submit(id) {
  const name = $("f-name").value.trim(), email = $("f-email").value.trim(), start = $("f-start").value, months = +$("f-term").value;
  const plaque = $("f-plaque").value.trim().toUpperCase();
  const lines = plaque ? plaque.split("\n") : [];
  const err = msg => { $("f-err").textContent = msg; $("f-err").hidden = false; };
  if (!name) return err("Enter your name or organization.");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err("Enter a valid email address, like name@example.com.");
  if (!start) return err("Pick a start date.");
  if (start < TODAY) return err("The start date can't be in the past.");
  if (lines.length > 3 || lines.some(l => l.length > 32)) return err("The plaque fits 3 lines of up to 32 characters. Shorten the inscription.");
  const end = endOf(start, months);
  const clash = overlaps(id, start, end);
  if (clash) return err(`That overlaps an existing term (${fmt(clash.start)} – ${fmt(clash.end)}). Start on ${fmt(earliestStart(id))} or later.`);
  adoptions.push({ id: "u" + Date.now(), benchId: id, donor: name, email, anonymous: $("f-anon").checked, plaque, start, months, end, createdAt: TODAY });
  save(); render();
  toast(`${start > TODAY ? "Reserved" : "Adopted"} ${id} for ${termLabel(months)}, through ${fmt(end)}. Thank you!`);
}

let tt;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 4500); }

/* ---------- events ---------- */
function select(id) {
  state.sel = id; render();
  if (window.matchMedia("(max-width:900px)").matches) $("panel").scrollIntoView({ behavior: "smooth", block: "start" });
}
$("view").addEventListener("click", e => { const el = e.target.closest("[data-id]"); if (el) select(el.dataset.id); });
$("view").addEventListener("keydown", e => { if (e.key === "Enter") { const el = e.target.closest("tr[data-id]"); if (el) select(el.dataset.id); } });
$("chips").addEventListener("click", e => { const el = e.target.closest("[data-f]"); if (el) { state.filter = el.dataset.f; render(); } });
$("q").addEventListener("input", e => { state.q = e.target.value; render(); });
const setView = v => { state.view = v; try { localStorage.setItem(KEY + ":view", v); } catch (e) {} render(); };
$("v-map").addEventListener("click", () => setView("map"));
$("v-list").addEventListener("click", () => setView("list"));
$("reset").addEventListener("click", () => { adoptions = seed(); save(); state.sel = null; render(); toast("Sample data restored."); });

render();
})();
</script>
